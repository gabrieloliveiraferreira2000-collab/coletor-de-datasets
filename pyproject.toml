[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coletor-datasets"
version = "0.2.0"
description = "Aplicativo desktop em português para coletar dados da web com seletores CSS e filtros configuráveis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
dev = ["ruff>=0.5"]
build = ["pyinstaller>=6.22"]

[project.scripts]
coletor-hardware = "coletor_hardware.cli:main"
coletor-datasets = "coletor_datasets.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]

